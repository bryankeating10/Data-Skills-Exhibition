services:
  db:
    image: postgres:16
    networks:
      - chessnet
    container_name: database
    environment:
      POSTGRES_DB: database
      POSTGRES_USER: chessuser
      POSTGRES_PASSWORD: chess
    volumes:
      - database-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chessuser -d database"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    container_name: analysis
    build: .
    networks:
      - chessnet
    image: analysis
    volumes:
      - backup-data:/app/Data
      - reports:/app/Reports
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://chessuser:chess@db:5432/database

volumes:
  backup-data:
    name: backup-data
  reports:
    name: reports
  database-volume:
    name: database-volume

networks:
  chessnet:
    name: chessnet