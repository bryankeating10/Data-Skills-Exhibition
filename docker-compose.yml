services:
  db:
    image: postgres:16
    container_name: database
    environment:
      POSTGRES_DB: database
      POSTGRES_USER: chessuser
      POSTGRES_PASSWORD: chess
    volumes:
      - database-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chessuser -d database"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: analysis
    volumes:
      - backup-data:/app/Data
      - reports:/app/Reports
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://chessuser:chess@db:5432/database

volumes:
  backup-data:
  reports:
  database-volume: